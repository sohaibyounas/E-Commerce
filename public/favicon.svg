<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E6A8" />
      <stop offset="45%" stop-color="#F2A900" />
      <stop offset="100%" stop-color="#CC6F00" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D2000" />
      <stop offset="50%" stop-color="#4D2A00" />
      <stop offset="100%" stop-color="#241300" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bgGrad)" stroke="#F2A900" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Subtle Inner Ring -->
  <rect x="12" y="12" width="104" height="104" rx="24" fill="none" stroke="#F9E6A8" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Shopping Bag Body -->
  <path d="M36 46 L92 46 L86 98 C85.5 102 82 105 78 105 L50 105 C46 105 42.5 102 42 98 Z" fill="url(#goldGrad)" />

  <!-- Bag Handles -->
  <path d="M48 48 V36 C48 27.16 55.16 20 64 20 C72.84 20 80 27.16 80 36 V48" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Inner Bag Handle Gap (Contrast) -->
  <path d="M48 48 V36 C48 27.16 55.16 20 64 20 C72.84 20 80 27.16 80 36 V48" fill="none" stroke="#4D2A00" stroke-width="2" stroke-linecap="round" stroke-opacity="0.3"/>

  <!-- Luxury Diamond / Sparkle Accent -->
  <g transform="translate(64, 74)">
    <path d="M0 -15 L4.5 -4.5 L15 0 L4.5 4.5 L0 15 L-4.5 4.5 L-15 0 L-4.5 -4.5 Z" fill="#4D2A00" />
    <circle cx="0" cy="0" r="3" fill="#F9E6A8" filter="url(#glow)"/>
  </g>
</svg>

